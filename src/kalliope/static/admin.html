<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14121a">
<title>kalliope · booth</title>
<style>
  :root { --bg: #14121a; --fg: #e8e2f0; --dim: #8f86a3; --accent: #d4a373; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f1ea; --fg: #2a2433; --dim: #7a7188; --accent: #a05e2b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--bg); color: var(--fg);
         font-family: ui-monospace, "Cascadia Code", Menlo, monospace; }
  main { text-align: center; padding: 2rem; max-width: 30rem; }
  h1 { font-weight: 400; letter-spacing: 0.35em; font-size: 1rem;
       color: var(--dim); margin: 0 0 2rem; }
  #modes { display: flex; gap: 0.6rem; justify-content: center; }
  #modes button { background: none; border: 1px solid var(--dim);
       color: var(--fg); font: inherit; padding: 0.7rem 1.4rem;
       border-radius: 999px; cursor: pointer; }
  #modes button.on { border-color: var(--accent); color: var(--accent); }
  #status { color: var(--dim); font-size: 0.8rem; margin-top: 2rem;
            line-height: 1.7; min-height: 3.5rem; }
  #tokenrow { margin-top: 2.5rem; }
  input { background: none; border: 1px solid var(--dim); color: var(--fg);
          font: inherit; font-size: 0.8rem; padding: 0.5rem 0.8rem;
          border-radius: 6px; width: 18rem; max-width: 90%; }
  .hint { color: var(--dim); font-size: 0.7rem; margin-top: 0.6rem; }
  #programrow { margin-top: 2rem; display: flex; gap: 0.5rem;
                justify-content: center; flex-wrap: wrap; }
  #minutes { width: 4.5rem; }
  #brief { width: 13rem; }
  #commission { background: none; border: 1px solid var(--dim);
                color: var(--fg); font: inherit; font-size: 0.8rem;
                padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
  #commission:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>─── the booth ───</h1>
  <div id="modes">
    <button data-mode="dj">dj</button>
    <button data-mode="auto">auto</button>
    <button data-mode="music">music</button>
  </div>
  <div id="status">…</div>
  <div id="programrow">
    <input id="minutes" type="number" min="10" max="360" placeholder="90">
    <input id="brief" placeholder="what kind of show? (Cal's call if blank)">
    <button id="commission">program</button>
  </div>
  <div id="tokenrow">
    <input id="token" type="password" placeholder="admin token" autocomplete="off">
    <div class="hint">dj: Cal always on · auto: Cal works when someone's listening · music: no API at all</div>
  </div>
</main>
<script>
  const tokenInput = document.getElementById("token");
  const statusEl = document.getElementById("status");
  tokenInput.value = localStorage.getItem("kalliope_admin") || "";
  tokenInput.addEventListener("change", () => {
    localStorage.setItem("kalliope_admin", tokenInput.value.trim());
    refresh();
  });

  function hdrs() { return { "x-admin-token": tokenInput.value.trim() }; }

  async function refresh() {
    try {
      const r = await fetch("/admin/status", { headers: hdrs() });
      const s = await r.json();
      if (!r.ok) { statusEl.textContent = s.reason || "no access"; return; }
      document.querySelectorAll("#modes button").forEach(b =>
        b.classList.toggle("on", b.dataset.mode === s.power));
      const sp = s.spend || {};
      const row = (w) => sp[w] ? `$${sp[w].usd.toFixed(2)}` : "—";
      statusEl.innerHTML =
        `power: <b>${s.power}</b> · Cal is ${s.dj_on_the_clock ? "on the clock" : "off the clock"} (${s.dj_model})<br>` +
        `${s.listeners} listening · ${s.deck} on deck` +
        (s.planning ? " · planning now" : "") +
        (s.program ? `<br>program: <b>${s.program}</b>` : "") + `<br>` +
        `spend: ${row("today")} today · ${row("week")} 7d · ${row("month")} 30d · ${row("all")} ever` +
        (sp.month ? `<br>voice: ${(sp.month.tts_chars / 1000).toFixed(1)}k chars this month` : "");
    } catch (e) { statusEl.textContent = "station unreachable"; }
  }

  document.querySelectorAll("#modes button").forEach(b =>
    b.addEventListener("click", async () => {
      await fetch("/admin/power", {
        method: "POST",
        headers: { ...hdrs(), "Content-Type": "application/json" },
        body: JSON.stringify({ mode: b.dataset.mode }),
      });
      refresh();
    }));

  const commissionBtn = document.getElementById("commission");
  commissionBtn.addEventListener("click", async () => {
    const minutes = Number(document.getElementById("minutes").value) || 90;
    const brief = document.getElementById("brief").value.trim();
    commissionBtn.disabled = true;
    try {
      const r = await fetch("/admin/program", {
        method: "POST",
        headers: { ...hdrs(), "Content-Type": "application/json" },
        body: JSON.stringify({ minutes, brief }),
      });
      const s = await r.json();
      statusEl.textContent = r.ok
        ? `commissioned: ~${minutes} min — Cal is building the show`
        : (s.reason || "commission failed");
    } catch (e) { statusEl.textContent = "station unreachable"; }
    setTimeout(() => { commissionBtn.disabled = false; refresh(); }, 4000);
  });

  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
